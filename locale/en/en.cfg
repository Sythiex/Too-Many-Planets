tmp-asteroid-belt-requires-interstellar-science=[font=default-bold]Asteroid Belt:[/font] Discovery requires Muluna exploration science
tmp-cubium-requires-interstellar-science=[font=default-bold]Cubium:[/font] Discovery requires Muluna exploration science
tmp-hovercrafts-recipe-changes=[font=default-bold]Hovercrafts:[/font] Recipe changes
tmp-more-long-inserters-lignumis-fix=[font=default-bold]More Long Inserters:[/font] Fix broken recipes with Lignumis
tmp-muluna-tech-qol=[font=default-bold]Muluna:[/font] Thruster fuel and oxidizer are unlocked together
