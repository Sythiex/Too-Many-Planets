[mod-setting-description]
tmp-aai-loaders-require-electricity=Recommended for use with [font=default-bold]AAI Loaders, a sane rebalance[/font] or similar mod
tmp-arig-buff-robots=Changes Arig "pressure" surface property 600 → 1200. This may have unintended side effects with recipe availability on Arig.
tmp-asteroid-belt-requires-interstellar-science=No effect unless [font=default-bold]Asteroid Belt[/font] and [font=default-bold]Muluna, Moon of Nauvis[/font] are installed.
tmp-cubium-requires-interstellar-science=No effect unless [font=default-bold]Cubium[/font] and [font=default-bold]Muluna, Moon of Nauvis[/font] are installed.
tmp-hovercrafts-recipe-changes=Hovercraft requires flying robot frames, missile hovercraft requires rocket turrets
tmp-more-long-inserters-lignumis-fix=Fix uncraftable Lignumis Steam Long Hand Inserters. Unsure what causes this, this setting just ensures they have a recipe if both mods are present.
tmp-muluna-tech-qol=Both techs are unlocked by crafting a thruster
tmp-quality-plus-plus-integration=Requires [font=default-bold]Paracelsin[/font], [font=default-bold]Secretas&Frozeta[/font], [font=default-bold]Vesta[/font]. Splits Quality++ qualities into sequential technologies. Progression: Paracelsin → Legendary, Aquilo → Mythical, Secretas & Frozeta → Masterwork, Vesta → Wondrous, Shattered Planet → Artifactual.
tmp-turbobike-hoverbike-requires-hovercraft=No effect if [font=default-bold]Hovercrafts[/font] is not installed
tmp-vesta-main-progression=Gas manipulation science required for Promethium science. Recommended if also using [font=default-bold]Quality++[/font] progression. No effect if [font=default-bold]Planet Vesta[/font] is not installed.

[technology-name]
tmp-mythical-quality=Mythical quality
tmp-masterwork-quality=Masterwork quality
tmp-wondrous-quality=Wondrous quality
tmp-artifactual-quality=Artifactual quality
